<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine 💘</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="puzzle-wrap" aria-label="Puzzle section">
        <div id="puzzleStage" class="puzzle-stage" aria-label="Puzzle stage">
          <div id="puzzle" class="puzzle" role="grid" aria-label="Image board"></div>
          <div id="piecesLayer" class="pieces-layer" aria-label="Puzzle pieces"></div>
        </div>
        <div class="controls">
          <button id="shuffleBtn" type="button">Shuffle</button>
        </div>
      </section>
    </main>

    <section id="resultModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-actions">
          <button id="yesBtn" type="button" class="yes-btn">Yes</button>
          <button id="noBtn" type="button" class="no-btn">No</button>
        </div>
      </div>
    </section>

    <div id="heartLayer" class="heart-layer" aria-hidden="true"></div>

    <script src="script.js"></script>
  </body>
</html>
